-ce? \u2014 C'est Pierre."],["Le\xE7on 3","Est-ce que (yes/no questions)","Add before statement. Before vowel: Est-ce qu'.","Est-ce que tu parles fran\xE7ais?||Est-ce qu'il y a des amis?"],["Le\xE7on 3","Adjective agreement","Adjectives match noun in gender and number.","grand/grande/grands/grandes||gros/grosse, mince/mince"],["Le\xE7on 4","Possessive adjectives","Agree with noun. Before f. vowel use mon/ton/son.","mon/ma/mes, ton/ta/tes, son/sa/ses||mon amie (NOT ma amie)"],["Le\xE7on 4","Reflexive verb structure","Subject + me/te/se/nous/vous/se + verb. Before vowel: m'/t'/s'.","je me lave, tu te laves, il se lave||je m'appelle"],["Le\xE7on 4","Countries + prepositions","EN f. countries/continents. AU m. AUX plural. \xC0 cities.","en France, au Japon, aux \xC9tats-Unis, \xE0 Paris"],["Le\xE7on 4","Quel/Quelle/Quels/Quelles","Interrogative adjective, agrees with noun.","Quel est ton nom?||Quelle est ta nationalit\xE9?"],["Le\xE7on 4","Age uses AVOIR","French uses avoir for age, not \xEAtre.","J'ai 30 ans (NOT je suis 30 ans)||Tu as quel \xE2ge?"],["Le\xE7on 6","Aimer + definite article","aimer/adorer/d\xE9tester always take le/la/les.","J'aime LE cin\xE9ma||J'adore LA musique||Je d\xE9teste LES maths"],["Le\xE7on 6","Likes/dislikes scale","From adorer (+++) to d\xE9tester (---).","adorer > aimer beaucoup > aimer bien||ne pas aimer > d\xE9tester"],["Le\xE7on 6","Professions gender forms","Most have m/f forms. Some invariable.","vendeur/vendeuse, -eur/-euse||m\xE9decin, dentiste (same)"],["Le\xE7on 7","Place prepositions (au/\xE0 la/\xE0 l'/aux)","au=\xE0+le, \xE0 la, \xE0 l' (vowel), aux=\xE0+les.","au caf\xE9, \xE0 la mer, \xE0 l'h\xF4pital, aux toilettes"],["Le\xE7on 7","Vouloir / Pouvoir","To want / to be able. Both irregular.","je veux/peux, nous voulons/pouvons, ils veulent/peuvent"],["Le\xE7on 7","On = nous (informal)","On means 'we' informally, conjugates as 3rd singular.","On va au cin\xE9ma? = Nous allons au cin\xE9ma?"],["Le\xE7on 7","Tout/toute/tous/toutes","Agrees with noun. tous pronoun = [tus].","tout le livre, toute la journ\xE9e||tous mes amis, toutes les filles"],["Le\xE7on 8","Possessive adjectives (full)","mon/ma/mes, ton/ta/tes, son/sa/ses, notre/nos, votre/vos, leur/leurs.","Agree with noun, not owner||mon amie (vowel rule)"],["Le\xE7on 8","Devoir/Voir/Croire/Boire","Four irregular verbs.","je dois/vois/crois/bois||nous devons/voyons/croyons/buvons"],["Le\xE7on 9","Il y a / Il n'y a pas de","There is/are. Neg: pas DE (article disappears).","Il y a des fleurs \u2192 Il n'y a pas DE fleurs||Il n'y a pas d'ascenseur"],["Le\xE7on 9","De + article contractions","de+le=du, de+les=des. de la, de l' stay.","du, de la, de l', des"],["Le\xE7on 9","Quantity expressions + de","beaucoup de, peu de, un kilo de \u2014 no article.","beaucoup de lacs||une tasse de caf\xE9||un verre de vin"],["Le\xE7on 9","Elision","Before vowel: je\u2192j', me\u2192m', le\u2192l', ne\u2192n', etc.","j'habite, je m'appelle, l'ami, je n'aime pas"],["Le\xE7on 10","Dates","le + number + month. le premier for 1st only.","le 15 mars||le premier janvier (1st only)"],["Le\xE7on 10","Date prepositions","EN month/year. AU printemps. EN other seasons.","en mars, en 2024||au printemps, en \xE9t\xE9/automne/hiver"],["Le\xE7on 10","Futur proche","aller (conjugated) + infinitive. Neg: ne+aller+pas+inf.","je vais lire, il va pleuvoir||nous n'allons pas travailler"],["Le\xE7on 10","Days: le = habitual","LE + day = every. No article = this/next.","le samedi = every Saturday||samedi = this Saturday"],["Le\xE7on 11","Telling time","Quelle heure est-il? et quart, et demie, moins le quart, pile.","Il est 3h et demie||8h moins le quart||midi pile"],["Le\xE7on 11","heure plural","deux heures (with -s). midi/minuit never take -s.","une heure, deux heures||midi, minuit (no -s)"],["Le\xE7on 11","Punctuality expressions","\xEAtre \xE0 l'heure / en avance / en retard.","Je suis \xE0 l'heure||Tu es en retard!"],["Le\xE7on 12","De quelle couleur...?","Asking about colors. Answer: il/elle est + color.","De quelle couleur est le sac? \u2014 Il est bleu."],["Le\xE7on 12","Invariable colors","orange, rose, marron never change. Compound colors invariable.","Les feuilles sont orange||bleu clair, vert fonc\xE9"],["Le\xE7on 12","Weather with faire","il fait + adjective. il pleut, il neige.","il fait beau/chaud/froid||il pleut, il neige"],["Le\xE7on 13","Ce/Cet/Cette/Ces","Demonstratives. cet before m. vowel/h.","ce matin, cet apr\xE8s-midi, cette nuit, ces nuages"],["Le\xE7on 13","Compass directions","au nord/sud, \xE0 l'est/ouest. dans le nord.","au nord il fait froid||\xE0 l'est il neige"],["Le\xE7on 14","Weather + seasons","il fait + adj. AU printemps, EN \xE9t\xE9/automne/hiver.","il fait beau||au printemps, en hiver"],["Le\xE7on 14","2nd group -ir verbs","-is,-is,-it,-issons,-issez,-issent.","vieillir, jaunir, verdir, finir, choisir, grandir"],["Le\xE7on 14","ne...pas / ne...plus","ne...pas = not. ne...plus = no longer. des\u2192de after neg.","Il ne pleut pas||On ne voit plus||pas d'amis"],["Le\xE7on 14","Comparatives plus/moins","plus = more, moins = less. + que to compare.","Les jours sont plus courts||plus longs que"],["Le\xE7on 15","Reflexive verbs (full)","me/te/se/nous/vous/se + verb. Neg wraps pronoun+verb.","je me lave, je ne me lave pas||se r\xE9veiller, se coucher"],["Le\xE7on 15","Tonic/stressed pronouns","After prepositions: moi, toi, lui, elle, nous, vous, eux, elles.","chez moi, chez toi||Je sors de chez moi"],["Le\xE7on 15","sortir/partir/dormir","3rd group -ir: lose stem consonant in singular.","je sors, nous sortons||je dors, nous dormons"],["Le\xE7on 15","faire + chores","Fixed expressions with faire.","le m\xE9nage, les courses, la lessive, la vaisselle"],["Le\xE7on 16","Three ways to ask 'what'","Formal: Que+inverted. Standard: Qu'est-ce que. Casual: ...quoi.","Que faites-vous?||Qu'est-ce que vous faites?||Vous faites quoi?"],["Le\xE7on 16","Question words + prepositions","Preposition before question word. qui=people, quoi=things.","avec qui? \xE0 quoi? sur quoi?"],["Le\xE7on 16","Reflexive verbs + prepositions","s'occuper DE, s'int\xE9resser \xC0, s'habituer \xC0.","s'int\xE9resser au sport||s'occuper des enfants"],["Le\xE7on 16","ne...plus","No longer / not anymore.","Je ne me d\xE9p\xEAche plus||Il ne travaille plus"],["Le\xE7on 16","Sequence words","d'abord, ensuite, avant, maintenant, quand.","D'abord... ensuite...||Avant... maintenant..."],["Le\xE7on 16","\xEAtre en train de","+ infinitive = present continuous (right now).","Je suis en train de faire la vaisselle"],["Le\xE7on 17","Recevoir conjugation","je re\xE7ois, tu re\xE7ois, il re\xE7oit, nous recevons, ils re\xE7oivent.","Cedilla \xE7 keeps the s-sound before o"],["Le\xE7on 17","Reflexive + preposition drill","\xE0+le=au, \xE0+les=aux, de+le=du, de+les=des.","s'int\xE9resser au sport, aux plantes||s'occuper du jardin, des chats"],["Le\xE7on 17","Futur proche + weather","aller + infinitive for forecasts.","il va faire beau||les temp\xE9ratures vont monter"],["Le\xE7on 18","Pass\xE9 compos\xE9 with avoir","avoir (conjugated) + past participle. -er verbs \u2192 -\xE9.","j'ai mang\xE9, tu as mang\xE9, il a mang\xE9||nous avons regard\xE9"],["Le\xE7on 18","Past participle -er \u2192 \xE9","Regular -er verbs: drop -er, add -\xE9.","manger\u2192mang\xE9, regarder\u2192regard\xE9, travailler\u2192travaill\xE9"],["Le\xE7on 18","Present \u2192 pass\xE9 compos\xE9","Replace present conjugation with avoir + PP.","Nous fermons \u2192 Nous avons ferm\xE9"],["Le\xE7on 18","Quart d'heure de politesse","Arrive 15 min late to dinner (cultural). On time elsewhere.","Dinner: 15 min late. Work/train/doctor: on time"],["Le\xE7on 19","Pass\xE9 compos\xE9 irregular PP","Grouped by ending: -u, -i, -is, -it.","-u: bu, lu, vu, attendu, re\xE7u, d\xFB, pu, voulu||-is: pris, mis||-it: dit, \xE9crit"],["Le\xE7on 19","\xC0 vs DE with places","Going TO: \xE0/au/\xE0 la. Coming FROM: de/du/de la.","je vais \xE0 la banque||je sors de la banque"],["Le\xE7on 19","au lieu de + infinitive","Instead of doing something.","au lieu de prendre les cl\xE9s, j'ai pris..."],["Le\xE7on 20","Pass\xE9 compos\xE9 negation","ne...pas wraps around avoir only, not the participle.","il n'a pas lu||je n'ai pas compris"],["Le\xE7on 20","Transport EN vs \xC0","EN = enclosed (voiture, train, avion). \xC0 = exposed (v\xE9lo, pied, moto).","en voiture, en avion||\xE0 v\xE9lo, \xE0 pied"],["Le\xE7on 20","Directions","tourner \xE0 gauche/droite, tout droit, traverser, monter/descendre.","tournez \xE0 droite||allez tout droit||traversez le pont"],["Le\xE7on 20","sortir de vs aller \xE0","FROM: sortir du/de la. TO: aller au/\xE0 la.","je sors du magasin||je vais au concert"],["Le\xE7on 21","Vivre conjugation","je vis, tu vis, il vit, nous vivons, vous vivez, ils vivent. PP: v\xE9cu.","habiter = address, vivre = life/existence"],["Le\xE7on 21","\xEAtre en train de + inf","Present continuous \u2014 happening right now.","Je suis en train de regarder un film"],["Le\xE7on 21","\xEAtre/tomber en panne","To be broken / to break down (machines).","L'ascenseur est en panne||Ma voiture est tomb\xE9e en panne"],["Le\xE7on 21","Asking directions","Pour aller \xE0...? + traverser, prendre la X\xE8me \xE0 gauche/droite.","Pour aller \xE0 la gare?||Vous prenez la deuxi\xE8me \xE0 droite"],["Le\xE7on 1","Pronunciation: vowel combinations","Key vowel sounds: o/au/eau=[o], eu/oeu=[\xF8], ai=[\u025B], ou=[u], oi=[wa].","jaune, eau, tableau [o]||s\u0153ur, c\u0153ur [\xF8]||maison, lait [\u025B]||vous, bonjour [u]||moi, toi [wa]"],["Le\xE7on 1","Pronunciation: c and g","c/g before a,o,u are hard [k]/[g]; before e,i,y are soft [s]/[\u0292]. \xE7 always [s].","Canada [k], cin\xE9ma [s]||gare [g], girafe [\u0292]||gar\xE7on, fran\xE7ais [s]"],["Le\xE7on 1","Self-introduction template","Je m'appelle... J'ai...ans. Je suis... J'habite \xE0...en... Je parle... J'apprends le fran\xE7ais.","Je m'appelle Linas. J'ai 34 ans. Je suis \xE9conomiste. J'habite \xE0 Vilnius en Lituanie."],["Le\xE7on 4","Continents use EN","All continents take en: en Europe, en Asie, en Afrique, en Am\xE9rique, en Australie.","en Europe||en Asie||en Afrique"],["Le\xE7on 4","Invariable nationalities","Some nationalities are the same for m. and f.: russe, suisse, belge.","Il est russe / Elle est russe||belge, suisse"],["Le\xE7on 7","On = nous (informal we)","'On' replaces 'nous' in casual speech, conjugates as 3rd person singular.","On va au cin\xE9ma = Nous allons au cin\xE9ma||On mange ensemble"],["Le\xE7on 7","faire du / de la (activities)","faire du + m., faire de la + f., faire de l' + vowel for activities.","faire du ski, du sport, de l'athl\xE9tisme||faire de la natation"],["Le\xE7on 12","Avoir lieu / se passer","avoir lieu = to take place (events). se passer = to happen.","Le concert a lieu au stade||\xC7a se passe en mai"],["Le\xE7on 12","Invariable colours","orange, rose, marron and compound colours never change form.","les feuilles orange||le vert fonc\xE9, le bleu clair"],["Le\xE7on 13","Futur proche with weather","aller + infinitive to forecast weather.","il va faire beau||il va y avoir des orages||la temp\xE9rature va monter"],["Le\xE7on 14","2nd group -ir verbs (seasons)","Nature verbs are 2nd group: -is,-is,-it,-issons,-issez,-issent.","verdir, jaunir, brunir, rougir, fleurir, finir||les feuilles jaunissent"],["Le\xE7on 14","ouvrir / couvrir (conjugate like -er)","Despite -ir ending, these conjugate like -er verbs in present.","j'ouvre, nous ouvrons||je couvre, il couvre"],["Le\xE7on 14","ne...plus (no longer)","ne...plus means 'no longer / not anymore'. Wraps the verb.","On ne voit plus les arbres||Il ne travaille plus"],["Le\xE7on 17","s'int\xE9resser \xE0 / s'occuper de","Reflexive verbs with fixed prepositions. \xE0+le=au, de+le=du.","s'int\xE9resser au sport, \xE0 la musique, aux plantes||s'occuper du jardin, des enfants"],["Le\xE7on 22","Pass\xE9 compos\xE9 with \xCATRE","A set of movement/state-change verbs + all reflexives use \xEAtre (not avoir) as auxiliary. subject + \xEAtre + past participle.","je suis all\xE9, tu es parti, il est mont\xE9||nous sommes arriv\xE9s, ils sont rest\xE9s||elle est sortie"],["Le\xE7on 22","\xCATRE verbs list (house of \xEAtre)","aller, venir, arriver, partir, entrer, sortir, monter, descendre, rester, tomber, rentrer, revenir, retourner, passer, na\xEEtre, mourir \u2014 plus all reflexives.","Mostly movement or change of state||na\xEEtre\u2192n\xE9, mourir\u2192mort"],["Le\xE7on 22","Past participle agreement with \xEAtre","With \xEAtre, the participle agrees with the subject like an adjective: +e (f.), +s (m.pl.), +es (f.pl.).","Il est parti / Elle est partie||Ils sont partis / Elles sont parties||Elle s'est lev\xE9e"],["Le\xE7on 22","Negation with \xEAtre pass\xE9 compos\xE9","ne...pas wraps around the auxiliary \xEAtre.","Je ne me suis pas lev\xE9||Elle n'est pas sortie||nous ne nous sommes pas endormis"],["Le\xE7on 22","passer: \xEAtre vs avoir","passer with \xCATRE = to pass by/through. With AVOIR = to spend (time).","Il est pass\xE9 devant la gare||J'ai pass\xE9 deux jours \xE0 Rio"],["Le\xE7on 24","Pass\xE9 compos\xE9: \xEAtre OR avoir (transitive verbs)","Six verbs (monter, descendre, sortir, rentrer, passer, retourner) take \xCATRE when intransitive (movement), but AVOIR when they have a direct object (transitive).","Elle est sortie (she went out) / Elle a sorti son t\xE9l\xE9phone (she took out her phone)||Il est mont\xE9 (he went up) / Il a mont\xE9 les valises (he carried up the suitcases)||Elle est rentr\xE9e / Elle a rentr\xE9 la voiture au garage"],["Le\xE7on 24","Direction verbs: opposites","reculer \u2194 avancer, faire demi-tour, tourner le dos, continuer tout droit.","ne faites pas demi-tour, continuez tout droit||ne reculez pas, avancez"],["Le\xE7on 25","Irregular past participles: -uit / -ert","construire\u2192construit, produire\u2192produit, conduire\u2192conduit; couvrir\u2192couvert, souffrir\u2192souffert, ouvrir\u2192ouvert, offrir\u2192offert.","j'ai construit, j'ai conduit||j'ai couvert, j'ai souffert"],["Le\xE7on 25","Real-estate ads (abbreviations)","Ads shorten words: appart.=appartement, imm.=immeuble, \xE9t.=\xE9tage, p.=pi\xE8ces, anc.=ancien, mod.=moderne.","Apart., 2 p., imm. mod., 8e \xE9t.||Maison, centre ville, 2 \xE9t., 5 p."],["Le\xE7on 26","visiter vs rendre visite \xE0","visiter + place (visiter la ville). rendre visite \xE0 + person (rendre visite \xE0 mes parents).","Je visite ma ville natale||Je rends visite \xE0 mes parents"],["Le\xE7on 26","Inversion with -t-","When a verb ends in a vowel before il/elle/on, insert -t- for questions.","va-t-il? pense-t-il? chante-t-elle?"],["Le\xE7on 26","nouveau vs neuf","nouveau/nouvel/nouvelle = new (to me). neuf/neuve = brand new (unused). nouvel before m. vowel.","un nouvel appartement||des chaussures neuves"],["Le\xE7on 28","Imparfait \u2014 formation","Take the nous form of the present, drop -ons, add: -ais, -ais, -ait, -ions, -iez, -aient. Only \xEAtre is irregular (j'\xE9tais).","nous faisons \u2192 je faisais||nous prenons \u2192 je prenais||\xEAtre \u2192 j'\xE9tais"],["Le\xE7on 28","Imparfait \u2014 when to use it","1) Habits in the past (used to). 2) Description/background (weather, feelings, setting). 3) An ongoing action interrupted by a pass\xE9 compos\xE9 event.","Quand j'\xE9tais jeune, je jouais au foot||Il faisait beau, les oiseaux chantaient||Je dormais quand le t\xE9l\xE9phone a sonn\xE9"],["Le\xE7on 28","Imparfait vs pass\xE9 compos\xE9","Imparfait = background, ongoing, repeated. Pass\xE9 compos\xE9 = single completed event that moves the story.","Je dormais (imparfait) quand le t\xE9l\xE9phone a sonn\xE9 (pass\xE9 compos\xE9)"],["Le\xE7on 28","Imparfait: fixed forms","il y a \u2192 il y avait; c'est \u2192 c'\xE9tait; il fait beau \u2192 il faisait beau.","il y avait beaucoup de monde||c'\xE9tait en 1990"]],pv=[["Le\xE7on 1","Comment \xE7a va ?","How are you? (informal)","Kaip sekasi?","Greeting"],["Le\xE7on 1
